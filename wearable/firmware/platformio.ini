; Jarvis watch firmware for the Waveshare ESP32-S3-Touch-AMOLED-1.75C.
; Flash and PSRAM choices match the official ESP-IDF example
; examples/esp-idf/02_lvgl_demo_v9/sdkconfig.defaults:
;   CONFIG_ESPTOOLPY_FLASHMODE_QIO
;   CONFIG_ESPTOOLPY_FLASHSIZE_32MB
;   CONFIG_SPIRAM_MODE_OCT
; Pins live in include/pin_config.h and are copied from Waveshare's board_config.

[platformio]
default_envs = waveshare_amoled_175c
boards_dir = boards

[env:waveshare_amoled_175c]
platform = espressif32
board = waveshare_esp32_s3_touch_amoled_175c
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = partitions.csv
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DLV_CONF_INCLUDE_SIMPLE
    -I${PROJECT_DIR}/include
lib_deps =
    lvgl/lvgl@8.4.0
    ; Waveshare ships 1.6.4. That release does not compile on Arduino-ESP32
    ; 3.3.6 or newer (spiFrequencyToClockDiv gained a parameter). 1.6.5 is
    ; the same library with that build fix. The CO5300 panel setup is unchanged.
    moononournation/GFX Library for Arduino@1.6.5
    lewisxhe/SensorLib@0.3.3
    tzapu/WiFiManager@^2.0.17
    bblanchon/ArduinoJson@^7.2.0
